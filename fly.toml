# Open UX — Fly.io
# Deploy: fly launch --no-deploy && fly volumes create open_ux_data --size 1 && fly secrets set OPEN_UX_PEPPER=... OPEN_UX_ADMIN_TOKEN=... && fly deploy
# Then set OPEN_UX_PUBLIC_URL to the assigned https URL.

app = "open-ux"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPEN_UX_MODE = "hosted"
  OPEN_UX_HOSTED = "1"
  OPEN_UX_CATALOG = "/app/catalog/guidelines.json"
  OPEN_UX_SCHEMA = "/app/catalog/schema.json"
  OPEN_UX_DATA_DIR = "/data"
  OPEN_UX_DATABASE = "/data/open-ux.sqlite"
  OPEN_UX_TELEMETRY = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[mounts]]
  source = "open_ux_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
