  <text x="278" y="96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#1F1C1A">Review</text>
  <text x="278" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1F1C1A">Check work in hand.</text>
  <text x="278" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1F1C1A">jobs= still. No file.</text>
  <rect x="492" y="40" width="210" height="200" rx="6" fill="#FFFFFF" stroke="#1F1C1A" stroke-width="2"/>
  <rect x="492" y="40" width="210" height="8" rx="6" fill="#FF4B00"/>
