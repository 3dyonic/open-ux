<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Open UX: catalog to audit flow">
  <rect width="1280" height="420" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1280" height="4" fill="#0969da"/>
  <!-- Catalog -->
  <rect x="64" y="88" width="280" height="244" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="84" y="124" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328">Catalog</text>
  <text x="84" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#656d76">Cited rules · one file</text>
  <rect x="84" y="176" width="240" height="36" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <text x="96" y="198" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#0969da">forms.field_labels…</text>
  <rect x="84" y="224" width="240" height="36" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="96" y="246" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#656d76">jobs[] · patterns[]</text>
  <rect x="84" y="272" width="240" height="36" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="96" y="294" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#656d76">citation · check</text>
  <!-- Arrow 1 -->
  <path d="M360 210 H460" stroke="#656d76" stroke-width="2" fill="none"/>
  <path d="M448 202 L460 210 L448 218" stroke="#656d76" stroke-width="2" fill="none"/>
  <!-- Tools -->
  <rect x="476" y="88" width="280" height="244" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="496" y="124" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328">Agent tools</text>
  <text x="496" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#656d76">list · get · audit</text>
  <rect x="496" y="176" width="240" height="40" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="512" y="200" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">list_guidelines</text>
  <rect x="496" y="228" width="240" height="40" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="512" y="252" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">get_guideline</text>
  <rect x="496" y="280" width="240" height="40" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="512" y="304" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#0969da">audit</text>
  <!-- Arrow 2 -->
  <path d="M772 210 H872" stroke="#656d76" stroke-width="2" fill="none"/>
  <path d="M860 202 L872 210 L860 218" stroke="#656d76" stroke-width="2" fill="none"/>
  <!-- Result -->
  <rect x="888" y="88" width="328" height="244" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="908" y="124" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328">Verdict</text>
  <text x="908" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#656d76">Pass / fail · cite the rule</text>
  <rect x="908" y="184" width="288" height="52" rx="4" fill="#ffebe9" stroke="#cf222e"/>
  <text x="924" y="214" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cf222e">fail · placeholder-only label</text>
  <rect x="908" y="252" width="288" height="52" rx="4" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="924" y="282" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a7f37">pass · visible label present</text>
  <!-- Footer title -->
  <text x="64" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2328">Open UX</text>
  <text x="180" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#656d76">Cited UX rules agents audit against</text>
</svg>
