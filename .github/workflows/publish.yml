name: publish
on:
  push:
    tags:
      - "v*"
    branches: [master]
    # PyPI = catalog + MCP tools (pip install open-ux). Not hosted site/mail/static.
    # packages/web/** never listed here — web-only merges skip this workflow.
    paths:
      - ".github/workflows/publish.yml"
      - "catalog/**"
      - "packages/mcp/pyproject.toml"
      - "packages/mcp/hatch_build.py"
      - "packages/mcp/hatch_metadata.py"
      - "packages/mcp/src/**"
      - "!packages/mcp/tests/**"
      - "!packages/mcp/src/open_ux/static/**"
      - "!packages/mcp/src/open_ux/mail.py"
      - "!packages/mcp/src/open_ux/public_html.py"
      - "!packages/mcp/src/open_ux/settings.py"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        default: testpypi
        options:
          - testpypi

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
      contents: write
    outputs:
      skip: ${{ steps.prep.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare version
        id: prep
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "publish_pypi=true" >> "$GITHUB_OUTPUT"
            echo "push_tag=" >> "$GITHUB_OUTPUT"
            echo "tag ${GITHUB_REF_NAME}"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "publish_pypi=false" >> "$GITHUB_OUTPUT"
            echo "push_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            changed="$(git diff --name-only "${GITHUB_SHA}^!" || git ls-files)"
          else
            changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi
          echo "$changed"
          # One -E pattern: bare multiple args are treated as filenames, not patterns.
          pypi="$(echo "$changed" | grep -Ev \
            '^packages/mcp/tests/|^packages/mcp/src/open_ux/static/|^packages/mcp/src/open_ux/mail\.py$|^packages/mcp/src/open_ux/public_html\.py$|^packages/mcp/src/open_ux/settings\.py$' \
            || true)"
          echo "pypi-relevant:"
          echo "$pypi"
          workflow_changed=false
          if echo "$changed" | grep -qxF '.github/workflows/publish.yml'; then
            workflow_changed=true
            echo "publish workflow changed; allow republish"
          fi
          if [[ "$workflow_changed" != true ]] && ! echo "$pypi" | grep -Eq '^(catalog/|packages/mcp/pyproject\.toml|packages/mcp/hatch_build\.py|packages/mcp/hatch_metadata\.py|packages/mcp/src/)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "publish_pypi=false" >> "$GITHUB_OUTPUT"
            echo "push_tag=" >> "$GITHUB_OUTPUT"
            echo "no PyPI-relevant change; skip"
            exit 0
          fi

          last="$(git describe --tags --abbrev=0)"
          ver="${last#v}"
          IFS=. read -r maj min pat <<< "$ver"
          subject="$(git log -1 --format=%s)"
          if echo "$subject" | grep -Eqi '(^|[[:space:]])BREAKING([:]|[[:space:]])|BREAKING CHANGE'; then
            new="v${maj}.$((min + 1)).0"
          else
            new="v${maj}.${min}.$((pat + 1))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new" -m "open-ux $new"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "publish_pypi=true" >> "$GITHUB_OUTPUT"
          echo "push_tag=$new" >> "$GITHUB_OUTPUT"
          echo "next $new (from $last)"
      - uses: actions/setup-python@v6
        if: steps.prep.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install build
        if: steps.prep.outputs.skip != 'true'
        working-directory: packages/mcp
        run: python -m pip install build
      - name: Build
        if: steps.prep.outputs.skip != 'true'
        working-directory: packages/mcp
        run: python -m build
      - name: Smoke from wheel
        if: steps.prep.outputs.skip != 'true'
        working-directory: packages/mcp
        run: |
          python -m pip install dist/*.whl
          python -m open_ux validate-catalog
      - name: Publish to PyPI
        if: github.event_name == 'push' && steps.prep.outputs.publish_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp/dist
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/mcp/dist
          repository-url: https://test.pypi.org/legacy/
      - name: Push version tag
        if: steps.prep.outputs.push_tag != ''
        run: git push origin "${{ steps.prep.outputs.push_tag }}"
