name: test
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    env:
      OPEN_UX_CATALOG: ${{ github.workspace }}/catalog/guidelines.json
      OPEN_UX_SCHEMA: ${{ github.workspace }}/catalog/schema.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate catalog
        run: python -m open_ux validate-catalog
      - name: Test
        run: python -m pytest -q
