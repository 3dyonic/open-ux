name: test
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    env:
      OPEN_UX_CATALOG: ${{ github.workspace }}/catalog
      OPEN_UX_SCHEMA: ${{ github.workspace }}/catalog/schema.json
      OPEN_UX_WEB_DIST: ${{ github.workspace }}/packages/web/dist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build web
        working-directory: packages/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate catalog
        run: python -m open_ux validate-catalog --strict-fit
      - name: Validate Claude plugin
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate ./clients/plugin --strict
      - name: Validate Cursor plugin
        working-directory: ${{ github.workspace }}
        run: node scripts/validate-cursor-plugin.mjs --strict
      - name: Test
        run: python -m pytest -q
